name: Publish to GitHub Packages

# Publishes this fork's packages to its OWN GitHub Packages feed
# (nuget.pkg.github.com/<owner>) — the feed a fork can publish to without any secret: the job's
# GITHUB_TOKEN carries `packages: write` for the repository it runs in. nuget.org is out of reach
# here on purpose: upstream publishes it through Trusted Publishing (OIDC), whose trust is bound to
# the upstream repository, and a PAT with `write:packages` is not something this workflow needs.
#
# Native binaries come from an `native-<ref>` release of ANOTHER repository (input
# native_source_repo, upstream by default): forks do not inherit release assets, and the binaries
# are Google's official LiteRT-LM C API prebuilts either way. The packages are the same layout the
# upstream flow packs, from the same sources and the same native prebuilts.
#
# One job on purpose: the feed can then never receive a package that did not build, pass the
# model-free test suite and resolve its native library from the packed nupkg (local-feed smoke).
#
# Run manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'NuGet package version. Empty = Version in Directory.Build.props.'
        required: false
        default: ''
      native_ref:
        description: 'LiteRT-LM ref whose native release to consume (release tag = native-<ref>). Empty = LiteRtLmVersion in Directory.Build.props.'
        required: false
        default: ''
      native_source_repo:
        description: 'Repository hosting the native-<ref> release. Empty = OrihuelaConde/LiteRtLmSharp (upstream).'
        required: false
        default: ''
      feed_owner:
        description: 'GitHub Packages owner (feed = nuget.pkg.github.com/<feed_owner>). Empty = this repository''s owner.'
        required: false
        default: ''
      managed_only:
        description: 'Publish only the managed packages (skip LiteRtLmSharp.runtime.<rid>)'
        type: boolean
        default: false
      dry_run:
        description: 'Build, test and pack without pushing to the feed or creating a release'
        type: boolean
        default: false

env:
  # The RIDs whose natives are packed; keep in sync with the runtime packages in LiteRtLmSharp.slnx.
  RIDS: win-x64 linux-x64 linux-arm64 android-arm64 android-x64 osx-arm64

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write   # the v<version> release that mirrors the feed
      packages: write   # the feed itself

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve versions, feed and release notes
        shell: pwsh
        run: |
          $pkg = '${{ inputs.package_version }}'
          if (-not $pkg) {
            $pkg = (Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          }
          $ref = '${{ inputs.native_ref }}'
          if (-not $ref) {
            $ref = (Select-String -Path Directory.Build.props -Pattern '<LiteRtLmVersion>([^<]+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          }
          $src = '${{ inputs.native_source_repo }}'
          if (-not $src) { $src = 'OrihuelaConde/LiteRtLmSharp' }
          $owner = '${{ inputs.feed_owner }}'
          if (-not $owner) { $owner = '${{ github.repository_owner }}' }
          # A package version is immutable once pushed, so publishing without notes that describe it is
          # a mistake we can still catch: the packed release notes must lead with the version, and the
          # CHANGELOG must have the section its release body is taken from.
          $notes = (Select-String -Path Directory.Build.props -Pattern '<PackageReleaseNotes>([^<]*)' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $notes.StartsWith("${pkg}:")) {
            throw "PackageReleaseNotes in Directory.Build.props do not start with ${pkg}: - update them before publishing."
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($pkg))\]" -Quiet)) {
            throw "CHANGELOG.md has no '## [${pkg}]' section - add one before publishing."
          }
          "PKG_VERSION=$pkg"        >> $env:GITHUB_ENV
          "NATIVE_REF=$ref"         >> $env:GITHUB_ENV
          "NATIVE_SOURCE_REPO=$src" >> $env:GITHUB_ENV
          "FEED_OWNER=$($owner.ToLowerInvariant())" >> $env:GITHUB_ENV
          Write-Host "package=$pkg native=$ref from=$src feed=nuget.pkg.github.com/$($owner.ToLowerInvariant())"

      - name: Download native binaries from native-${{ env.NATIVE_REF }}
        if: ${{ !inputs.managed_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p natives runtimes
          gh release download "native-${NATIVE_REF}" \
            --repo "${NATIVE_SOURCE_REPO}" \
            --pattern 'litertlm-*.tar.gz' \
            --pattern 'THIRD_PARTY_NOTICES.litert-lm.txt' \
            --dir natives
          ls -lh natives/
          # Upstream's notice file for the official binaries ships inside every runtime package; a
          # release without it is not something we publish from.
          [ -f natives/THIRD_PARTY_NOTICES.litert-lm.txt ] \
            || { echo "::error::native-${NATIVE_REF} has no THIRD_PARTY_NOTICES.litert-lm.txt asset"; exit 1; }
          cp natives/THIRD_PARTY_NOTICES.litert-lm.txt runtimes/
          declare -A map=(
            [litertlm-windows_x86_64.tar.gz]=win-x64
            [litertlm-linux_x86_64.tar.gz]=linux-x64
            [litertlm-linux_arm64.tar.gz]=linux-arm64
            [litertlm-android_arm64.tar.gz]=android-arm64
            [litertlm-android_x86_64.tar.gz]=android-x64
            [litertlm-macos_arm64.tar.gz]=osx-arm64
          )
          for asset in "${!map[@]}"; do
            rid="${map[$asset]}"
            mkdir -p "runtimes/$rid/native"
            tar -xzf "natives/$asset" -C "runtimes/$rid/native"
            find "runtimes/$rid/native" -name '._*' -delete
            echo "$rid: $(ls runtimes/$rid/native | tr '\n' ' ')"
          done
          # win-x64 must carry the DirectX Shader Compiler pair: the official Dawn backend has no FXC
          # fallback, and a GPU-less runner cannot notice their absence.
          for dxc in dxcompiler.dll dxil.dll; do
            [ -f "runtimes/win-x64/native/$dxc" ] || { echo "::error::win-x64 natives lack $dxc"; exit 1; }
          done

      - name: Build and test (model-free)
        shell: pwsh
        run: |
          dotnet build LiteRtLmSharp.slnx -c Release
          dotnet test LiteRtLmSharp.Tests/LiteRtLmSharp.Tests.csproj -c Release --no-build `
            --logger "console;verbosity=minimal"

      - name: Pack
        shell: pwsh
        run: |
          $common = @(
            '-c', 'Release', '-o', 'artifacts',
            "-p:Version=$env:PKG_VERSION",
            "-p:LiteRtLmVersion=$env:NATIVE_REF",
            '-p:ContinuousIntegrationBuild=true')
          dotnet pack LiteRtLmSharp/LiteRtLmSharp.csproj @common
          dotnet pack LiteRtLmSharp.Extensions.AI/LiteRtLmSharp.Extensions.AI.csproj @common
          dotnet pack LiteRtLmSharp.SemanticKernel/LiteRtLmSharp.SemanticKernel.csproj @common
          $withNatives = -not ('${{ inputs.managed_only }}' -eq 'true')
          foreach ($rid in ($env:RIDS -split '\s+')) {
            $native = "runtimes/$rid/native"
            if ($withNatives -and (Test-Path $native) -and (Get-ChildItem $native -ErrorAction SilentlyContinue)) {
              dotnet pack "packaging/LiteRtLmSharp.runtime.$rid/LiteRtLmSharp.runtime.$rid.csproj" @common
            }
            else {
              Write-Host "skip LiteRtLmSharp.runtime.$rid"
            }
          }
          Get-ChildItem artifacts/*.nupkg | Select-Object Name, Length

      # Consumes the packed packages from a local feed the way a real consumer does: through the
      # runtime package's runtimes/<rid>/native layout, which the repo's own test suite never
      # exercises (it runs against the flat dev copy of the natives). No model is needed — resolving
      # the native library and calling into it is the whole assertion, and it is exactly what a
      # broken package layout breaks.
      - name: Local-feed smoke
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'smoke-fed'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <RestorePackagesPath>packages</RestorePackagesPath>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="LiteRtLmSharp" Version="__VERSION__" />
              <PackageReference Include="LiteRtLmSharp.runtime.win-x64" Version="__VERSION__" />
            </ItemGroup>
          </Project>
          '@ .Replace('__VERSION__', $env:PKG_VERSION) | Set-Content (Join-Path $dir 'Smoke.csproj')
          @'
          using LiteRtLmSharp;

          // Touching LiteRtEngine runs the native-library resolver, and SetMinLogLevel is a real
          // P/Invoke: a package whose natives are missing or misplaced fails right here.
          LiteRtEngine.SetMinLogLevel(3);
          Console.WriteLine($"live engines={LiteRtEngine.LiveEngineCount}, multi-engine={LiteRtEngine.AllowMultipleEngines}");
          Console.WriteLine($"near-greedy={LiteRtSamplerParams.NearGreedy.Strategy}/{LiteRtSamplerParams.NearGreedy.TopP}/{LiteRtSamplerParams.NearGreedy.Temperature}");
          Console.WriteLine("NATIVE_OK");
          '@ | Set-Content (Join-Path $dir 'Program.cs')
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$(Resolve-Path artifacts | Select-Object -ExpandProperty Path)" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content (Join-Path $dir 'nuget.config')
          Push-Location $dir
          try {
            $out = dotnet run -c Release
            $out | ForEach-Object { Write-Host $_ }
            if ($out -notmatch 'NATIVE_OK') { throw 'The packed packages could not resolve the native library.' }
          }
          finally { Pop-Location }

      - name: Push to GitHub Packages
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $feed = "https://nuget.pkg.github.com/$env:FEED_OWNER/index.json"
          dotnet nuget add source $feed --name github --username '${{ github.actor }}' `
            --password '${{ secrets.GITHUB_TOKEN }}' --store-password-in-clear-text
          $failed = @()
          foreach ($pkg in Get-ChildItem artifacts -Filter *.nupkg) {
            # Package versions are immutable; re-running the workflow for a version that is already on
            # the feed is expected and must not fail the run.
            dotnet nuget push $pkg.FullName --source github --skip-duplicate
            if ($LASTEXITCODE -ne 0) { $failed += $pkg.Name }
          }
          if ($failed.Count) { throw "Failed to push: $($failed -join ', ')" }
          Write-Host "Pushed $((Get-ChildItem artifacts -Filter *.nupkg).Count) package(s) to $feed"

      - name: Mirror the packages as release assets
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same .nupkg files as a GitHub release: an auditable copy that outlives the run's
          # artifact retention (the feed stays the installable source).
          gh release view "v$env:PKG_VERSION" --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release v$($env:PKG_VERSION) exists; leaving it alone."; exit 0 }
          gh release create "v$env:PKG_VERSION" (Get-ChildItem artifacts/*.nupkg).FullName `
            --repo '${{ github.repository }}' --target $env:GITHUB_SHA `
            --title "v$env:PKG_VERSION" `
            --notes "Published to the GitHub Packages feed: https://nuget.pkg.github.com/$env:FEED_OWNER/index.json`n`nNative binaries: LiteRT-LM $env:NATIVE_REF (Google's official C API prebuilts)."

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs-${{ env.PKG_VERSION }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
